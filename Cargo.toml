[package]
name = "shiguredo_opus"
version = "2026.4.0"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for the Opus audio codec"
readme = "README.md"
homepage = "https://github.com/shiguredo/opus-rs"
repository = "https://github.com/shiguredo/opus-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**/*"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.opus]
version = "1.6.1"
# origin: https://downloads.xiph.org/releases/opus/
url = "https://oss-mirrors.shiguredo.jp/"
sha256 = "6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1"

[dependencies]

[build-dependencies]
# bindgen: Opus の C ヘッダーから FFI バインディングを生成する
bindgen = "0.73"
# cc: cmake クレートのコンパイラ判定に Android NDK の C / C++ コンパイラを指定する
cc = "1.4"
# shiguredo_cmake: 外部ライブラリ (libopus) の CMake ビルドとシンボル書き換えを行う
shiguredo_cmake = "4.4"
# shiguredo_toml: Cargo.toml のメタデータ (外部ライブラリの取得情報) を読み取る
shiguredo_toml = "2026.2"

[features]
default = ["dred"]
dred = []
source-build = []
